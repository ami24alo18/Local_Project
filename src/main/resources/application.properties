spring.application.name=hotel-service

# DataSource settings: set here configurations for the database connection
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/customer
spring.datasource.username=root
spring.datasource.password=Amit@9519
spring.jpa.show-sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
hibernate.transaction.jta.platform=enable
spring.main.allow-bean-definition-overriding=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.flywaydb=DEBUG
flyway.supportedDDLTransactions=NONE
spring.main.banner-mode=off

# Hibernate settings
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Server configuration
server.port=1995
# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.file=logs/application.log
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=src/main/resources/db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.repeatable-sql-migration-prefix=R
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=[ '.sql' ]

# CORS configuration
#spring.mvc.cors.allow-credentials=true
#spring.mvc.cors.allowed-headers=*
#spring.mvc.cors.allowed-methods=GET,POST,DELETE
#spring.mvc.cors.allowed-origins=http://localhost:3000
#spring.mvc.cors.max-age=3600
jwt.secret=your_secret_key
jwt.expiration=3600 # Token expiration time in seconds
springfox.documentation.swagger.v2.path=/api-docs

# ================================
# Actuator Endpoints
# ================================
# Enable detailed metrics collection for HTTP requests
management.metrics.distribution.sla.http.server.requests=1ms,5ms,10ms,50ms,100ms,500ms,1s

# Show detailed health info
management.endpoint.health.show-details=always

# Expose actuator endpoints (include prometheus)
management.endpoints.web.exposure.include=health,info,metrics,httptrace,prometheus

# Enable prometheus endpoint
management.endpoint.prometheus.enabled=true

# Application tag
management.metrics.tags.application=MySpringApp

# Enable histogram buckets (so Prometheus gets *_bucket samples)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Also set client-side percentiles (optional)
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99

# Define SLO buckets if you want explicit buckets (optional)
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s

# If you have many distinct templated URIs, increase limit (avoid 'none' or fallback)
management.metrics.web.server.max-uri-tags=200

# keep httptrace for quick debugging (last 100 requests)
management.endpoint.httptrace.enabled=true





